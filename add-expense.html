
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense | Smart GenZ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html">Smart GenZ</a>
    <span>Student Expense Manager</span>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a class="active" href="add-expense.html">Add Expense</a>
    <a href="history.html">History</a>
    <a href="report.html">Monthly Report</a>
    <a href="settings.html">Settings</a>
  </nav>

  <main class="narrow">
    <section class="hero">
      <div>
        <p class="eyebrow">DAILY TRACKER</p>
        <h1>Add New Expense</h1>
        <p>Enter your daily spending details below.</p>
      </div>
    </section>

    <form id="expenseForm" class="panel form-grid">
      <label>
        Expense Name
        <input id="expenseName" type="text" placeholder="e.g. Lunch" required>
      </label>

      <label>
        Amount (₹)
        <input id="expenseAmount" type="number" min="1" step="0.01" placeholder="150" required>
      </label>

      <label>
        Category
        <select id="expenseCategory">
          <option>Food</option>
          <option>Travel</option>
          <option>Hostel/PG</option>
          <option>Study</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
      </label>

      <label>
        Date
        <input id="expenseDate" type="date" required>
      </label>

      <label class="full">
        Note (Optional)
        <textarea id="expenseNote" rows="3" placeholder="Extra details"></textarea>
      </label>

      <label class="full">
        Payment Screenshot (Optional)
        <input id="expenseScreenshot" type="file" accept="image/*">
        <small>This starter version does not save the screenshot.</small>
      </label>

      <div class="full">
        <button class="btn" type="submit">Save Expense</button>
        <a class="btn secondary" href="index.html">Cancel</a>
        <p id="formMessage"></p>
      </div>
    </form>
  </main>

  <footer>Smart GenZ</footer>
  <script src="app.js"></script>
</body>
</html>
